<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History and Favorites - AutoComm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="fas fa-robot me-2"></i>AutoComm</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/workflow-composer">Workflow Composer</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/history">History</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row">
            <div class="col-lg-10 mx-auto">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h1 class="display-5 fw-bold mb-1">History and Favorites</h1>
                        <p class="mb-0" style="color: var(--text-secondary);">Review previous outputs and mark important items.</p>
                    </div>
                    <div class="d-flex gap-2">
                        <button id="showAll" class="btn btn-outline-primary btn-sm">All</button>
                        <button id="showFav" class="btn btn-outline-warning btn-sm"><i class="fas fa-star me-1"></i>Favorites</button>
                    </div>
                </div>

                <div id="historyEmpty" class="alert alert-info" style="display:none;">No history items yet.</div>
                <div id="historyList"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        let favoriteOnly = false;

        async function loadHistory() {
            const list = document.getElementById('historyList');
            const empty = document.getElementById('historyEmpty');
            list.innerHTML = '';

            const response = await fetch('/api/history?favorite_only=' + (favoriteOnly ? 'true' : 'false'));
            const data = await response.json();

            const items = (data.items || []);
            if (!items.length) {
                empty.style.display = 'block';
                return;
            }

            empty.style.display = 'none';
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card mb-3';
                card.innerHTML = `
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <div>
                                <h5 class="mb-1">${item.title}</h5>
                                <div class="small text-muted">${item.module} | ${new Date(item.created_at).toLocaleString()}</div>
                            </div>
                            <div class="d-flex gap-2">
                                <button class="btn btn-sm ${item.favorite ? 'btn-warning' : 'btn-outline-warning'}" data-action="favorite" data-id="${item.id}"><i class="fas fa-star"></i></button>
                                <button class="btn btn-sm btn-outline-danger" data-action="delete" data-id="${item.id}"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                        <div class="mb-2"><strong>Input:</strong> ${item.input_preview || '-'}</div>
                        <div><strong>Output:</strong> ${item.output_preview || '-'}</div>
                    </div>
                `;
                list.appendChild(card);
            });

            list.querySelectorAll('button[data-action="favorite"]').forEach(btn => {
                btn.addEventListener('click', async () => {
                    await fetch('/api/history/' + btn.dataset.id + '/favorite', { method: 'POST' });
                    await loadHistory();
                });
            });

            list.querySelectorAll('button[data-action="delete"]').forEach(btn => {
                btn.addEventListener('click', async () => {
                    await fetch('/api/history/' + btn.dataset.id, { method: 'DELETE' });
                    await loadHistory();
                });
            });
        }

        document.getElementById('showAll').addEventListener('click', async function () {
            favoriteOnly = false;
            await loadHistory();
        });

        document.getElementById('showFav').addEventListener('click', async function () {
            favoriteOnly = true;
            await loadHistory();
        });

        loadHistory();
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflow Composer - AutoComm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="fas fa-robot me-2"></i>AutoComm</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/workflow-composer">Workflow Composer</a></li>
                    <li class="nav-item"><a class="nav-link" href="/history">History</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row">
            <div class="col-lg-10 mx-auto">
                <div class="text-center mb-4">
                    <h1 class="display-5 fw-bold mb-2">Workflow Composer</h1>
                    <p class="lead" style="color: var(--text-secondary);">Build your own AI pipeline and run it in one click.</p>
                </div>

                <div class="card shadow-lg">
                    <div class="card-header"><h5 class="mb-0"><i class="fas fa-diagram-project me-2"></i>Configure Workflow</h5></div>
                    <div class="card-body">
                        <form id="workflowComposerForm" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="workflowText" class="form-label fw-bold">Input Text</label>
                                <textarea id="workflowText" class="form-control" rows="6" placeholder="Paste text here or upload a document..."></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="workflowFile" class="form-label fw-bold">Or Upload File</label>
                                <input id="workflowFile" type="file" class="form-control" accept=".pdf,.docx,.pptx,.txt,.md,.text">
                                <div class="form-text">Supported: PDF, DOCX, PPTX, TXT, MD</div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-3">
                                    <div class="form-check"><input class="form-check-input" type="checkbox" id="stepSummarize" checked><label class="form-check-label" for="stepSummarize">Summarize</label></div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-check"><input class="form-check-input" type="checkbox" id="stepTranslate" checked><label class="form-check-label" for="stepTranslate">Translate</label></div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-check"><input class="form-check-input" type="checkbox" id="stepTTS" checked><label class="form-check-label" for="stepTTS">Text to Speech</label></div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-check"><input class="form-check-input" type="checkbox" id="stepEmail"><label class="form-check-label" for="stepEmail">Email Output</label></div>
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-4">
                                    <label class="form-label fw-bold" for="summaryLength">Summary Length</label>
                                    <select id="summaryLength" class="form-select">
                                        <option value="short">Short</option>
                                        <option value="medium" selected>Medium</option>
                                        <option value="long">Long</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold" for="summaryStyle">Summary Style</label>
                                    <select id="summaryStyle" class="form-select">
                                        <option value="paragraph" selected>Paragraph</option>
                                        <option value="bullet">Bullet Points</option>
                                        <option value="abstract">Abstract</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold" for="targetLanguage">Translate To</label>
                                    <select id="targetLanguage" class="form-select">
                                        {% for code, name in translate_languages %}
                                        <option value="{{ code }}" {% if code == 'en' %}selected{% endif %}>{{ name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold" for="ttsLanguage">TTS Language</label>
                                    <select id="ttsLanguage" class="form-select">
                                        {% for code, name in tts_languages %}
                                        <option value="{{ code }}" {% if code == 'en' %}selected{% endif %}>{{ name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="col-md-6" id="emailSubjectWrap" style="display:none;">
                                    <label class="form-label fw-bold" for="emailSubject">Email Subject</label>
                                    <input id="emailSubject" class="form-control" type="text" placeholder="AutoComm Workflow Output">
                                </div>
                            </div>

                            <div id="emailFields" style="display:none;" class="border rounded p-3 mb-3">
                                <div class="row g-3">
                                    <div class="col-md-4"><input id="senderEmail" class="form-control" placeholder="Sender Email"></div>
                                    <div class="col-md-4"><input id="senderPassword" type="password" class="form-control" placeholder="Sender Password"></div>
                                    <div class="col-md-4"><input id="receiverEmail" class="form-control" placeholder="Receiver Email"></div>
                                </div>
                            </div>

                            <div class="d-grid">
                                <button class="btn btn-primary btn-lg" id="runWorkflowBtn" type="submit"><i class="fas fa-play me-2"></i>Run Workflow</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div id="workflowLoading" class="text-center my-4" style="display:none;">
                    <div class="spinner-border" role="status"><span class="visually-hidden">Loading...</span></div>
                    <p class="mt-2" style="color: var(--text-secondary);">Running workflow...</p>
                </div>

                <div id="workflowError" class="alert alert-danger mt-4" style="display:none;"></div>

                <div id="workflowResults" class="card mt-4" style="display:none;">
                    <div class="card-header"><h5 class="mb-0"><i class="fas fa-check-circle me-2"></i>Workflow Results</h5></div>
                    <div class="card-body">
                        <div id="workflowStepResults" class="mb-3"></div>
                        <div class="mb-3"><h6>Output Text</h6><div id="workflowOutputText" class="p-3 rounded" style="background: var(--bg-secondary);"></div></div>
                        <div id="workflowAudioWrap" style="display:none;"><h6>Generated Audio</h6><audio id="workflowAudio" controls class="w-100"></audio></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('workflowComposerForm');
            const stepEmail = document.getElementById('stepEmail');
            const emailFields = document.getElementById('emailFields');
            const emailSubjectWrap = document.getElementById('emailSubjectWrap');
            const loading = document.getElementById('workflowLoading');
            const errorBox = document.getElementById('workflowError');
            const results = document.getElementById('workflowResults');

            function toggleEmailFields() {
                const show = stepEmail.checked;
                emailFields.style.display = show ? 'block' : 'none';
                emailSubjectWrap.style.display = show ? 'block' : 'none';
            }

            stepEmail.addEventListener('change', toggleEmailFields);
            toggleEmailFields();

            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                errorBox.style.display = 'none';
                results.style.display = 'none';
                loading.style.display = 'block';

                const steps = [];
                if (document.getElementById('stepSummarize').checked) steps.push('summarize');
                if (document.getElementById('stepTranslate').checked) steps.push('translate');
                if (document.getElementById('stepTTS').checked) steps.push('text_to_speech');
                if (document.getElementById('stepEmail').checked) steps.push('email');

                const payload = new FormData();
                payload.append('text', document.getElementById('workflowText').value);
                payload.append('summary_length', document.getElementById('summaryLength').value);
                payload.append('summary_style', document.getElementById('summaryStyle').value);
                payload.append('target_language', document.getElementById('targetLanguage').value);
                payload.append('tts_language', document.getElementById('ttsLanguage').value);
                payload.append('send_email', document.getElementById('stepEmail').checked ? 'true' : 'false');
                payload.append('sender_email', document.getElementById('senderEmail').value);
                payload.append('sender_password', document.getElementById('senderPassword').value);
                payload.append('receiver_email', document.getElementById('receiverEmail').value);
                payload.append('subject', document.getElementById('emailSubject').value || 'AutoComm Workflow Output');
                const f = document.getElementById('workflowFile').files[0];
                if (f) payload.append('file', f);
                steps.forEach(step => payload.append('steps', step));

                try {
                    const response = await fetch('/api/workflow-composer', { method: 'POST', body: payload });
                    const data = await response.json();
                    if (!response.ok || !data.success) {
                        throw new Error(data.error || 'Workflow execution failed');
                    }

                    const stepHtml = (data.steps || []).map(s => `<span class="badge text-bg-success me-2 mb-2">${s.step}: ${s.status}</span>`).join('');
                    document.getElementById('workflowStepResults').innerHTML = stepHtml;

                    const outputText = data.outputs.translated_text || data.outputs.summary || data.outputs.original_text || '';
                    document.getElementById('workflowOutputText').textContent = outputText;

                    const audioWrap = document.getElementById('workflowAudioWrap');
                    if (data.outputs.audio_url) {
                        audioWrap.style.display = 'block';
                        document.getElementById('workflowAudio').src = data.outputs.audio_url;
                    } else {
                        audioWrap.style.display = 'none';
                    }

                    results.style.display = 'block';
                } catch (err) {
                    errorBox.textContent = err.message;
                    errorBox.style.display = 'block';
                } finally {
                    loading.style.display = 'none';
                }
            });
        });
    </script>
</body>

</html>
